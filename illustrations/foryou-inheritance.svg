<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/>
      <stop offset="1" stop-color="#efe8d8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyI)"/>
  <!-- ground -->
  <path d="M0 250 L400 250 L400 300 L0 300 Z" fill="#e5dcc4" opacity="0.55"/>
  <!-- house (small, distant/memory) -->
  <g stroke="#1a2f4d" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <path d="M255 250 L255 175 L305 140 L355 175 L355 250 Z" fill="#fbfaf6"/>
    <path d="M255 175 L305 140 L355 175" stroke-width="2"/>
    <rect x="290" y="200" width="30" height="50" fill="#f5f0e5"/>
    <rect x="265" y="185" width="22" height="22" fill="#f5f0e5"/>
    <rect x="325" y="185" width="22" height="22" fill="#f5f0e5"/>
  </g>
  <!-- document / scroll -->
  <g stroke="#1a2f4d" stroke-width="1.8" fill="#fbfaf6" stroke-linejoin="round">
    <rect x="50" y="130" width="130" height="150" rx="2"/>
  </g>
  <g stroke="#1a2f4d" stroke-width="1" fill="none" opacity="0.6">
    <line x1="65" y1="155" x2="165" y2="155"/>
    <line x1="65" y1="170" x2="165" y2="170"/>
    <line x1="65" y1="185" x2="140" y2="185"/>
    <line x1="65" y1="215" x2="165" y2="215"/>
    <line x1="65" y1="230" x2="165" y2="230"/>
    <line x1="65" y1="245" x2="120" y2="245"/>
  </g>
  <!-- seal/stamp on document (gold) -->
  <circle cx="140" cy="255" r="14" fill="none" stroke="#b89452" stroke-width="1.5" opacity="0.85"/>
  <text x="140" y="260" text-anchor="middle" font-family="serif" font-size="11" fill="#b89452" font-weight="700">印</text>
  <!-- key (gold) -->
  <g stroke="#b89452" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="205" cy="130" r="10" fill="#f5f0e5"/>
    <line x1="215" y1="130" x2="245" y2="130"/>
    <line x1="238" y1="130" x2="238" y2="138"/>
    <line x1="245" y1="130" x2="245" y2="140"/>
  </g>
  <!-- connecting line (document → house) suggests handover -->
  <path d="M185 200 Q220 205, 255 210" stroke="#b89452" stroke-width="1.5" fill="none" stroke-dasharray="3 4" opacity="0.7"/>
  <!-- sun -->
  <circle cx="70" cy="55" r="20" fill="none" stroke="#b89452" stroke-width="1.4" opacity="0.7"/>
  <circle cx="70" cy="55" r="12" fill="#d4b578" opacity="0.5"/>
  <!-- decorative -->
  <circle cx="330" cy="70" r="1.8" fill="#b89452" opacity="0.55"/>
  <circle cx="350" cy="100" r="1.5" fill="#b89452" opacity="0.5"/>
</svg>
